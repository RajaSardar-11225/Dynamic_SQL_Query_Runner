<!DOCTYPE html>
<html>

<head>
    <title>Dynamic SQL Runner</title>

    <style>

        body{
            font-family: Arial;
            padding:20px;
        }

        textarea{
            width:100%;
            height:120px;
            font-size:16px;
        }

        button{
            margin-top:10px;
            padding:10px 20px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse: collapse;
            margin-top:20px;
        }

        th, td{
            border:1px solid black;
            padding:8px;
            text-align:center;
        }

    </style>

</head>

<body>

    <h1>Dynamic SQL Query Runner</h1>

    <form method="POST">

        <textarea name="query" placeholder="Write SQL Query Here"></textarea>

        <br>

        <button type="submit">Run Query</button>

    </form>

    {% if columns %}

    <table>

        <tr>

            {% for col in columns %}
                <th>{{col}}</th>
            {% endfor %}

        </tr>

        {% for row in result %}

        <tr>

            {% for data in row %}
                <td>{{data}}</td>
            {% endfor %}

        </tr>

        {% endfor %}

    </table>

    {% endif %}

</body>

</html>
